name: Sync assets to R2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ASSETS_BUCKET: ${{ secrets.R2_ASSETS_BUCKET }}
          R2_PUBLIC_BASE_URL: https://assets.tanja.app
        run: python3 .github/scripts/sync_r2.py
